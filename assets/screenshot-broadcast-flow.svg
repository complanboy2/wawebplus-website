<svg width="960" height="620" viewBox="0 0 960 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bulk and broadcast workflow</title>
  <desc id="desc">A WA Web Utils mock showing campaign recipients, readiness checks, pacing, action links, and reports.</desc>
  <rect width="960" height="620" rx="34" fill="#F7FAF8"/>
  <rect x="46" y="48" width="868" height="524" rx="28" fill="white" stroke="#DDE7E3"/>
  <text x="84" y="104" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">Broadcast Campaign</text>
  <rect x="84" y="132" width="180" height="34" rx="17" fill="#EFFCF6"/>
  <text x="108" y="155" fill="#008069" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">WA Web ready</text>
  <rect x="84" y="204" width="250" height="258" rx="22" fill="#F8FBFA" stroke="#DDE7E3"/>
  <text x="112" y="240" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Recipients</text>
  <text x="112" y="282" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="17">+919876543210</text>
  <text x="112" y="324" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="17">+14155552671</text>
  <text x="112" y="366" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="17">+971501234567</text>
  <rect x="112" y="402" width="168" height="34" rx="17" fill="#E8F1EE"/>
  <text x="133" y="424" fill="#667781" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Duplicates removed</text>
  <rect x="374" y="204" width="250" height="258" rx="22" fill="#F8FBFA" stroke="#DDE7E3"/>
  <text x="402" y="240" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Message</text>
  <rect x="402" y="268" width="194" height="96" rx="16" fill="white" stroke="#DDE7E3"/>
  <text x="424" y="302" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="16">Hi {{name}},</text>
  <text x="424" y="330" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="16">your quote is ready.</text>
  <rect x="402" y="390" width="176" height="34" rx="17" fill="#E7F8F1"/>
  <text x="423" y="412" fill="#008069" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">CTA link preserved</text>
  <rect x="664" y="204" width="198" height="258" rx="22" fill="#F8FBFA" stroke="#DDE7E3"/>
  <text x="692" y="240" fill="#111B21" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Safety</text>
  <text x="692" y="282" fill="#667781" font-family="Inter, Arial, sans-serif" font-size="16">Pacing checks</text>
  <text x="692" y="324" fill="#667781" font-family="Inter, Arial, sans-serif" font-size="16">Bridge readiness</text>
  <text x="692" y="366" fill="#667781" font-family="Inter, Arial, sans-serif" font-size="16">Send reports</text>
  <rect x="692" y="402" width="132" height="34" rx="17" fill="#00A884"/>
  <text x="723" y="424" fill="white" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Start send</text>
  <path d="M334 333H374" stroke="#00A884" stroke-width="5" stroke-linecap="round"/>
  <path d="M624 333H664" stroke="#00A884" stroke-width="5" stroke-linecap="round"/>
  <path d="M358 321L374 333L358 345" stroke="#00A884" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M648 321L664 333L648 345" stroke="#00A884" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="500" width="778" height="34" rx="17" fill="#EFFCF6"/>
  <text x="112" y="522" fill="#008069" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Real execution only: if WA Web is unavailable, WA Web Utils reports the failure instead of showing fake success.</text>
</svg>
